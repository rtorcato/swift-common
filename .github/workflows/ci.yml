name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["apps/docs/**", "**/*.md"]
  # No paths-ignore here: the required checks must always report, or docs-only
  # PRs sit BLOCKED. The `changes` job skips the heavy steps instead.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside apps/docs/ and *.md counts as code.
          if git diff --name-only --no-renames "$BASE_SHA"...HEAD \
            | grep -Ev '^apps/docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    name: swift build + test
    needs: changes
    # Run even if `changes` fails, so a failure there builds instead of skipping.
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - name: Skip on docs-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change, nothing to build."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'

      - name: Select latest stable Xcode
        if: needs.changes.outputs.code != 'false'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        if: needs.changes.outputs.code != 'false'
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: swift build
        if: needs.changes.outputs.code != 'false'
        run: swift build

      - name: swift test
        if: needs.changes.outputs.code != 'false'
        run: swift test

  lint:
    name: SwiftLint
    needs: changes
    # Run even if `changes` fails, so a failure there builds instead of skipping.
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - name: Skip on docs-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change, nothing to lint."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'
      - name: Install SwiftLint
        if: needs.changes.outputs.code != 'false'
        run: brew install swiftlint
      - name: swiftlint --strict
        if: needs.changes.outputs.code != 'false'
        run: swiftlint lint --strict --reporter github-actions-logging

  platforms:
    name: xcodebuild ${{ matrix.platform }}
    # The squash merge already ran this on the PR, so skip it on push to main.
    # Also skip on docs-only PRs; this job is not a required check.
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - macOS
          - tvOS
          - watchOS
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ matrix.platform }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-derived-${{ matrix.platform }}-

      - name: Build for ${{ matrix.platform }}
        run: |
          set -o pipefail
          xcodebuild \
            -scheme MatrixSwiftBaseUI \
            -destination "generic/platform=${{ matrix.platform }}" \
            -skipPackagePluginValidation \
            build | xcbeautify --renderer github-actions
