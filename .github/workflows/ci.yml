name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["apps/docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["apps/docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: swift build + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: swiftlint --strict
        run: swiftlint lint --strict --reporter github-actions-logging

  platforms:
    name: xcodebuild ${{ matrix.platform }}
    # The squash merge already ran this on the PR, so skip it on push to main.
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - macOS
          - tvOS
          - watchOS
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ matrix.platform }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-derived-${{ matrix.platform }}-

      - name: Build for ${{ matrix.platform }}
        run: |
          set -o pipefail
          xcodebuild \
            -scheme MatrixSwiftBaseUI \
            -destination "generic/platform=${{ matrix.platform }}" \
            -skipPackagePluginValidation \
            build | xcbeautify --renderer github-actions
