name: Release

# Batched releases: merging to main never publishes. A release runs only when
# a milestone is closed or the workflow is dispatched by hand, and ships
# everything merged since the last tag.
on:
  workflow_dispatch:
  milestone:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Lets the release job dispatch docs.yml after a publish, so the changelog
  # page (built from the GitHub Releases API) picks the new version up.
  actions: write

jobs:
  # Is a release already publishing? Then this request must queue behind it,
  # not cancel it mid-publish. One still waiting has published nothing, so
  # superseding that one is safe.
  in-flight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      publishing: ${{ steps.check.outputs.publishing }}
    steps:
      - name: Check for a release already publishing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publishing=false
          # A run waiting for approval is `waiting`, not `in_progress`.
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=in_progress" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id"); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[] | select(.status == "in_progress" and .name != "in-flight") | .name' | grep -q .; then
              publishing=true
            fi
          done
          echo "publishing=$publishing" >> "$GITHUB_OUTPUT"
          if [ "$publishing" = true ]; then
            echo "::notice::A release is already publishing; this one runs after it."
          fi

  release:
    needs: in-flight
    # Supersede a run still waiting, never one publishing.
    concurrency:
      group: release
      cancel-in-progress: ${{ needs.in-flight.outputs.publishing != 'true' }}
    name: semantic-release
    runs-on: ubuntu-latest
    # Holds every release until a required reviewer on the `release`
    # environment approves it.
    environment: release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7
        with:
          # The tip, not the event's SHA: the job starts after approval, and
          # semantic-release refuses a checkout the branch has moved past. A
          # dispatch releases the branch it ran from; a closed milestone
          # releases the default branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install release tooling
        run: pnpm install --frozen-lockfile=false --ignore-scripts

      - name: semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # The docs changelog page is built from the GitHub Releases API at docs
      # build time, and no release commit lands on main (the code-scanning-main
      # ruleset rejects one), so a publish only reaches the site once the site is
      # rebuilt. docs.yml cannot subscribe to `release`: that event runs with
      # `github.ref` set to the tag, and the `github-pages` environment only
      # accepts deployments from `main`. Dispatching on `main` keeps that intact.
      - name: Redeploy the docs after a publish
        # The publish has already happened; a hiccup here must not fail the job.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git tag --points-at HEAD | head -1)
          if [ -z "$tag" ]; then
            echo "No tag on HEAD, semantic-release published nothing. Skipping."
            exit 0
          fi
          echo "Published $tag, dispatching docs.yml on main."
          gh workflow run docs.yml --ref main
