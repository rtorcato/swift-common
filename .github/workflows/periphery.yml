name: Periphery

# Informational only, so it runs weekly instead of on every push.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dead-code:
    name: Periphery
    runs-on: macos-latest
    # Informational until codebase is cleaned up: no --strict, so findings are
    # warning annotations and the check stays green. Add --strict back after cleanup.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Periphery
        run: brew install periphery

      - name: periphery scan
        run: periphery scan --relative-results --format github-actions
